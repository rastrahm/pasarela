[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"
description = "API Gateway y orquestador de checkout — pasarela multi-rail (Fase 4)"
publish = false

[dependencies]
async-trait = "0.1"
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
domain = { path = "../domain" }
dotenvy = "0.15"
oracle-client = { path = "../oracle-client" }
rail-switcher = { path = "../rail-switcher" }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
settlement-adapters = { path = "../settlement-adapters" }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "uuid", "chrono", "rust_decimal"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1"
http-body-util = "0.1"
oracle-client = { path = "../oracle-client" }
rail-switcher = { path = "../rail-switcher" }
settlement-adapters = { path = "../settlement-adapters" }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
