[package]
name = "domain"
version = "0.1.0"
edition = "2021"
description = "Capa de dominio compartida — tipos, traits y errores sin infraestructura"
publish = false

[dependencies]
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
