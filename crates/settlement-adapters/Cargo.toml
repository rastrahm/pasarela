[package]
name = "settlement-adapters"
version = "0.1.0"
edition = "2021"
description = "Adaptadores de liquidación por riel — Strategy pattern (Bank, Binance, Solana)"
publish = false

[dependencies]
async-trait = "0.1"
domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
