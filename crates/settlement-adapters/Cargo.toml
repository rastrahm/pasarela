[package]
name = "settlement-adapters"
version = "0.1.0"
edition = "2021"
description = "Adaptadores de liquidación por riel — Strategy pattern (Bank, Binance, Solana)"
publish = false

[dependencies]
async-trait = "0.1"
borsh = "1"
bs58 = "0.5"
domain = { path = "../domain" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-client = "2.1"
solana-sdk = "2.1"
spl-associated-token-account = "6.0"
spl-token = "7.0"
thiserror = "1"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
