# Deploy manual a staging vía SSH (Fase 7 Bloque 2)
#
# Secrets requeridos en el repo (Settings → Secrets):
#   STAGING_SSH_HOST     — IP o hostname del VPS
#   STAGING_SSH_USER     — usuario SSH (ej. deploy)
#   STAGING_SSH_KEY      — clave privada PEM (multilínea)
#
# Opcional:
#   STAGING_REPO_PATH    — ruta del clone en el VPS (default: ~/pasarela)

name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama o tag a desplegar'
        required: true
        default: main
      profile:
        description: 'Perfil Compose (tls | local)'
        required: true
        default: tls
        type: choice
        options:
          - tls
          - local
      run_smoke:
        description: 'Ejecutar smoke bank post-deploy en el VPS'
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          command_timeout: 50m
          script: |
            set -euo pipefail
            REPO="${STAGING_REPO_PATH:-$HOME/pasarela}"
            cd "$REPO"
            git fetch origin
            git checkout "${{ inputs.ref }}"
            git pull origin "${{ inputs.ref }}"
            chmod +x scripts/*.sh deploy/staging/provision-vps.sh 2>/dev/null || true
            SMOKE_FLAG=""
            if [[ "${{ inputs.run_smoke }}" != "true" ]]; then
              SMOKE_FLAG="--no-smoke"
            fi
            ./scripts/deploy-staging.sh --profile "${{ inputs.profile }}" $SMOKE_FLAG
            echo "Deploy completado en $(hostname)"

      - name: Deploy gate OK
        run: echo "Staging desplegado — ejecutar smoke completo y verify-isolation desde fuera del VPS"
