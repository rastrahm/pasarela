[package]
name = "payment-settlement"
version = "0.1.0"
description = "Liquidación SPL on-chain — Pasarela Multi-Rail (Fase 3)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "payment_settlement"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["token"] }

