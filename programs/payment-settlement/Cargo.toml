[workspace]
members = [
    "programs/*"
]
resolver = "2"

# Solana CLI 2.2.x trae platform-tools v1.48 (rustc 1.84) — insuficiente para
# crates con edition2024 en el lockfile. v1.52 incluye rustc 1.89.
[workspace.metadata.solana]
tools-version = "v1.52"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
