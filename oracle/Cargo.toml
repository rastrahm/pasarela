[package]
name = "oracle-authorization"
version = "0.1.0"
edition = "2021"
description = "Oracle de autorización off-chain — servicio independiente de la pasarela"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "uuid", "chrono", "rust_decimal"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
oracle-client = { path = "../crates/oracle-client" }

[dev-dependencies]
axum = { version = "0.7", features = ["macros"] }
http-body-util = "0.1"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
